<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTR Mods — моды для GTA 5</title>
<meta name="description" content="Машины, мотоциклы и персонажи для GTA 5 от HTR. Add-On моды, оплата из любой страны.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: витрина-«гараж» — шапка с поиском, полоса категорий, сетка карточек с номерами лотов, корзина справа; режим владельца добавляет редактор товаров */
:root{
  --bg:#13151a; --panel:#1b1e25; --panel2:#232731; --line:#2e3340;
  --fg:#eceef2; --muted:#9298a6; --accent:#f2b632; --accent-ink:#1a1405; --cool:#5fb3c9; --danger:#e26a5f;
  --display:"Chakra Petch",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--cool)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.logo b{background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:3px;margin-right:6px}
.search{flex:1;min-width:0}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;color:var(--fg);font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;padding:10px 14px;font-weight:600;white-space:nowrap;border:1px solid var(--line);background:var(--panel2);text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--line))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.cnt{background:var(--accent-ink);color:var(--accent);border-radius:99px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px;font-family:var(--mono)}

.adminbar{background:color-mix(in srgb,var(--accent) 14%,var(--bg));border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,var(--line))}
.adminbar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px}
.adminbar span{font-size:13px;color:var(--fg);flex:1;min-width:180px}

.hero h1{font-family:var(--display);font-size:clamp(32px,5.2vw,58px);line-height:1.04;margin:0 0 14px;text-wrap:balance}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);max-width:56ch;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stats div{background:var(--panel);padding:14px;min-width:0}
.stats strong{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}

.cats{display:flex;gap:8px;overflow-x:auto;padding-block:6px 18px;scrollbar-width:none}
.cats button{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:8px 14px;white-space:nowrap;color:var(--muted);display:flex;gap:8px;align-items:center}
.cats button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cats .c{font-family:var(--mono);font-size:12px;opacity:.7}
.tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.tools .found{color:var(--muted);font-size:13px}
select,.f input,.f textarea{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;width:100%}
.tools select{width:auto;background:var(--panel)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding-bottom:56px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s;min-width:0}
.card:hover{transform:translateY(-2px);border-color:#454c5c}
.thumb{aspect-ratio:16/10;max-width:100%;position:relative;display:grid;place-items:center;cursor:pointer;border:0;padding:0;width:100%;overflow:hidden}
.thumb svg{width:56%;height:auto}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.lot{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.55);padding:3px 7px;border-radius:3px;color:#fff}
.tag{position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:3px}
.tag.new{background:var(--cool);color:#06222b}
.tag.hit{background:#ff7a1a;color:#1f0d00}
.pcount{position:absolute;bottom:10px;right:10px;font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.55);color:#fff;padding:2px 7px;border-radius:3px}
.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{font-family:var(--display);font-size:18px;margin:0;line-height:1.2;overflow-wrap:anywhere}
.specs{display:flex;flex-wrap:wrap;gap:6px}
.specs span{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 6px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px}
.price{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.add{padding:8px 12px}
.add.in{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.edit{position:absolute;bottom:10px;left:10px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:5px 10px;font-weight:600;font-size:13px}
.newcard{border:2px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);min-height:280px;display:grid;place-items:center;font-weight:600;font-size:16px}
.newcard:hover{border-color:var(--accent);color:var(--accent)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 0}

.how{border-top:1px solid var(--line);padding-block:40px}
.how h2{font-family:var(--display);font-size:26px;margin:0 0 18px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.steps div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.steps b{font-family:var(--mono);color:var(--accent);font-size:13px}
.steps h4{margin:6px 0;font-size:16px}
.steps p{margin:0;color:var(--muted);font-size:14px}
footer{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-bottom:64px}
.mono{font-family:var(--mono);color:var(--cool)}

.shade{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line);gap:12px}
.dh h3{font-family:var(--display);margin:0;font-size:20px}
.x{background:none;border:1px solid var(--line);border-radius:6px;width:34px;height:34px;flex:none}
.items{flex:1;overflow:auto;padding:8px 16px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sw{width:46px;height:46px;border-radius:6px;flex:none;overflow:hidden;position:relative}
.sw img{width:100%;height:100%;object-fit:cover}
.row .t{flex:1;min-width:0}
.row .t div{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--muted);font-family:var(--mono);font-size:11px}
.row .p{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row .rm{background:none;border:0;color:var(--muted);font-size:18px}
.df{padding:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.total{display:flex;justify-content:space-between;font-family:var(--display);font-size:22px}
.order{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;user-select:all;max-height:160px;overflow:auto}
.note{font-size:13px;color:var(--muted);margin:0}

.modal{position:fixed;inset:0;z-index:22;display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:680px;width:100%;max-height:100%;overflow:auto}
.mbox .thumb{cursor:default;aspect-ratio:16/9}
.gal{display:flex;gap:8px;padding:10px 20px 0;overflow-x:auto}
.gal button{width:64px;height:44px;border-radius:5px;overflow:hidden;border:2px solid transparent;padding:0;flex:none;background:var(--panel2)}
.gal button[aria-current="true"]{border-color:var(--accent)}
.gal img{width:100%;height:100%;object-fit:cover}
.mbody{padding:20px;display:flex;flex-direction:column;gap:12px}
.mbody h3{font-family:var(--display);font-size:26px;margin:0;overflow-wrap:anywhere}
.mbody p{margin:0;color:var(--muted);white-space:pre-wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono);min-width:0;overflow-wrap:anywhere}

.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0}
.f .wide{grid-column:1/-1}
.f textarea{min-height:90px;resize:vertical}
.f small{color:var(--muted);font-size:12px}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.ph{width:110px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel2)}
.ph img{width:110px;height:72px;object-fit:cover;display:block}
.ph div{display:flex}
.ph button{flex:1;background:none;border:0;border-top:1px solid var(--line);padding:4px;font-size:12px;color:var(--muted)}
.ph .cov{font-size:11px;color:var(--accent);text-align:center;padding:4px;border-top:1px solid var(--line)}
.upl{width:110px;height:100px;border:2px dashed var(--line);border-radius:6px;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;cursor:pointer;position:relative}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.mact{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}



/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);margin-bottom:22px;background:radial-gradient(60% 120% at 85% 0%,rgba(255,122,26,.16),transparent 70%),radial-gradient(50% 100% at 0% 100%,rgba(242,182,50,.10),transparent 70%)}
.herowrap{padding-block:48px 40px;display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.hero h1{font-family:var(--display);font-size:clamp(24px,6.2vw,68px);line-height:1.02;margin:0;white-space:nowrap;letter-spacing:.005em}
.hero h1 span{color:var(--accent)}
.hero .tagline{display:inline-flex;align-items:center;gap:10px;margin:0;font-family:var(--display);font-weight:600;font-size:clamp(18px,2.6vw,26px);color:#ffb35c;background:rgba(255,122,26,.12);border:1px solid rgba(255,122,26,.35);border-radius:99px;padding:8px 18px 8px 14px}
.hero .tagline svg{flex:none;animation:tap 2.4s ease-in-out infinite}
@keyframes tap{0%,70%,100%{transform:translate(0,0)}80%{transform:translate(2px,2px) scale(.9)}}
.ctarow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px}
.cta{padding:13px 22px;font-size:16px;box-shadow:0 8px 28px -8px rgba(242,182,50,.6);transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translateY(-2px);box-shadow:0 12px 32px -8px rgba(242,182,50,.75)}
.pays{display:flex;gap:8px;flex-wrap:wrap}
.pays span{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:4px 8px}
html{scroll-behavior:smooth}
#catalog{scroll-margin-top:80px}
a.logo{color:var(--fg);text-decoration:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.tagline svg{animation:none}}
/* карусель фото */
.thumb{cursor:pointer}
.thumb.big{cursor:default}
.tag{z-index:2;pointer-events:none}
.slides{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.slides::-webkit-scrollbar{display:none}
.slides.dragging{scroll-snap-type:none;cursor:grabbing}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative}
.thumb .slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;user-select:none;-webkit-user-drag:none}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:24px;line-height:1;display:grid;place-items:center;padding:0 0 3px;opacity:0;transition:opacity .15s}
.prev{left:8px}.next{right:8px}
.thumb:hover .nav,.nav:focus-visible{opacity:1}
@media (hover:none){.nav{display:none}}
.dots{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2;pointer-events:none;padding:4px 6px;border-radius:99px;background:rgba(0,0,0,.35)}
.dots span{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transition:width .15s}
.dots span.on{background:#fff;width:16px}
.langsel{width:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 8px;color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
@media (max-width:420px){.logo{font-size:18px}.logo .rest{display:none}.logo b{margin-right:0}}
@media (max-width:760px){
  .herowrap{padding-block:30px 26px}
  .steps{grid-template-columns:1fr}
  .lbl{display:none}
  .f{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"><p style="padding:40px;text-align:center;color:#9298a6">Загружаю каталог…</p></div>
<script src="/shop.js"></script>
</body>
</html>
